{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 변경 완료 | 서울 거래 리포트</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-story">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>준비<br />완료.</h1>
        <p>새 비밀번호로 다시 로그인하세요.</p>
        <span class="story-index">SECURE RESET</span>
      </section>
      <section class="login-panel">
        <p class="eyebrow">PASSWORD UPDATED</p>
        <h2>비밀번호를 변경했습니다.</h2>
        <a class="button button-dark" href="{% url 'login' %}"
          >로그인 <span aria-hidden="true">↗</span></a
        >
      </section>
    </main>
  </body>
</html>
