{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 찾기 | 서울 거래 리포트</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-story">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>다시<br />접속하기.</h1>
        <p>가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
        <span class="story-index">SECURE RESET</span>
      </section>
      <section class="login-panel">
        <p class="eyebrow">PASSWORD RESET</p>
        <h2>비밀번호 찾기</h2>
        <form method="post">
          {% csrf_token %}<label for="id_email">가입한 이메일</label>{{
          form.email }}{% for error in form.email.errors %}
          <p class="form-error">{{ error }}</p>
          {% endfor %}<button class="button button-dark" type="submit">
            재설정 링크 보내기 <span aria-hidden="true">↗</span>
          </button>
        </form>
        <div class="auth-links">
          <a href="{% url 'login' %}">로그인으로 돌아가기</a>
        </div>
      </section>
    </main>
  </body>
</html>
