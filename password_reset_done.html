{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>메일 확인 | 서울 거래 리포트</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-story">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>메일함을<br />확인하세요.</h1>
        <p>
          계정이 존재하고 이메일이 등록되어 있으면 재설정 안내를 보냈습니다.
        </p>
        <span class="story-index">SECURE RESET</span>
      </section>
      <section class="login-panel">
        <p class="eyebrow">EMAIL SENT</p>
        <h2>안내 메일을 확인해 주세요.</h2>
        <p>
          메일에 있는 링크를 열어 새 비밀번호를 설정하세요. 개발 환경에서는 메일
          내용이 실행 중인 터미널에 출력됩니다.
        </p>
        <div class="auth-links">
          <a href="{% url 'login' %}">로그인으로 돌아가기</a>
        </div>
      </section>
    </main>
  </body>
</html>
